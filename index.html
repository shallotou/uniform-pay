<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ユニフォーム代金のお支払い</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1d2a36;--sub:#5d6b78;--line:#dde3e8;--main:#1f5fa8;--main-soft:#e8f0fa;--ok:#1e8a4c;--ok-soft:#e6f5ec;--warn:#b5651d;--pp:#ff0033}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:4px 0 6px}
  .lead{color:var(--sub);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .step{font-size:13px;font-weight:700;color:var(--main);letter-spacing:.05em;margin-bottom:6px}
  .card h2{font-size:17px;margin:0 0 12px}
  select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  .order{margin-top:12px;background:var(--main-soft);border-radius:10px;padding:12px 14px;font-size:14px}
  .order .amt{font-size:24px;font-weight:700;margin-top:2px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
  .opt .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700}
  .opt .t{font-weight:700}
  .opt .d{font-size:13px;color:var(--sub)}
  .opt.on{border-color:var(--main);background:var(--main-soft)}
  .opt.on .no{background:var(--main);color:#fff}
  .detail{margin-top:14px;display:none}
  .detail.show{display:block}
  .chips{display:flex;gap:10px}
  .chip{flex:1;padding:14px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:inherit}
  .chip.on{border-color:var(--main);background:var(--main-soft);color:var(--main)}
  table.info{width:100%;border-collapse:collapse;font-size:15px}
  table.info td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.info td:first-child{color:var(--sub);width:6.5em;font-size:13px}
  table.info td.v{font-weight:700}
  .cp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--main);font-family:inherit}
  .note{font-size:13px;color:var(--sub);margin:10px 0 0}
  .note b{color:var(--ink)}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:12px;border:none;cursor:pointer}
  .btn-main{background:var(--main);color:#fff}
  .btn-main:disabled{background:#a9b6c2;cursor:default}
  .btn-pp{background:var(--pp);color:#fff;margin-top:12px}
  .done{display:none;text-align:center}
  .done.show{display:block}
  .done .mark{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:4px auto 10px}
  .banner{background:#fff4e5;border:1px solid #f0cf9f;color:var(--warn);font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none}
  .prev{font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 10px;margin-top:10px;display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2a36;color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .link{display:block;text-align:center;margin-top:14px;font-size:14px;color:var(--main)}
  #listCard table{width:100%;border-collapse:collapse;font-size:14px}
  #listCard td,#listCard th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
  #listCard th{font-size:12px;color:var(--sub);font-weight:600}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg)}
  .tag.paid{background:var(--ok-soft);color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ユニフォーム代金のお支払い</h1>
  <p class="lead" id="lead">ユニフォームが完成しました！お名前を選んで、お支払い方法を選択してください。</p>
  <div class="banner" id="banner"></div>

  <div id="form">
    <!-- STEP1 -->
    <div class="card">
      <div class="step">STEP 1</div>
      <h2>お名前を選択</h2>
      <select id="name"><option value="">名前を読み込み中…</option></select>
      <div class="order" id="order" style="display:none"></div>
      <div class="prev" id="prev"></div>
    </div>

    <!-- STEP2 -->
    <div class="card">
      <div class="step">STEP 2</div>
      <h2>お支払い方法を選択</h2>
      <div class="opts">
        <button class="opt" data-m="現金"><span class="no">1</span><span><span class="t">現金で支払う</span><br><span class="d" id="cashDesc"></span></span></button>
        <button class="opt" data-m="銀行振込"><span class="no">2</span><span><span class="t">銀行振込</span><br><span class="d">下に振込先が表示されます</span></span></button>
        <button class="opt" data-m="PayPay"><span class="no">3</span><span><span class="t">PayPayで送る</span><br><span class="d">アプリでそのまま送れます</span></span></button>
        <button class="opt" data-m="その他"><span class="no">4</span><span><span class="t">その他</span><br><span class="d">ご希望・ご相談を入力してください</span></span></button>
      </div>

      <!-- ① 現金 -->
      <div class="detail" id="d-現金">
        <p class="note" style="margin:0 0 8px">お支払いする日を選んでください</p>
        <div class="chips" id="cashChips"></div>
        <p class="note">当日、担当者へ現金でお渡しください。<b>おつりのないよう</b>ご用意いただけると助かります。</p>
      </div>

      <!-- ② 銀行振込 -->
      <div class="detail" id="d-銀行振込">
        <table class="info" id="bankTable"></table>
        <p class="note">振込名義は<b>選択したお名前</b>でお願いします（ご家族名義の場合は「その他」欄でお知らせください）。振込手数料はご負担ください。</p>
      </div>

      <!-- ③ PayPay -->
      <div class="detail" id="d-PayPay">
        <table class="info" id="ppTable"></table>
        <a class="btn btn-pp" id="ppBtn" target="_blank" rel="noopener">PayPayアプリで送る</a>
        <p class="note" id="ppNote"></p>
      </div>

      <!-- ④ その他 -->
      <div class="detail" id="d-その他">
        <textarea id="other" placeholder="例：11/22の練習で支払いたい／分割で相談したい など"></textarea>
      </div>
    </div>

    <button class="btn btn-main" id="submit" disabled>この内容で登録する</button>
    <p class="note" style="text-align:center">登録後、振込・送金を済ませてください。担当者が入金を確認します。</p>
  </div>

  <!-- 完了 -->
  <div class="card done" id="done">
    <div class="mark">✓</div>
    <h2 id="doneTitle">登録しました</h2>
    <p id="doneMsg" style="margin:0;color:var(--sub);font-size:14px"></p>
    <button class="btn btn-main" style="margin-top:16px" onclick="location.reload()">戻る</button>
  </div>

  <a class="link" href="#" id="toggleList">みんなの登録状況を見る</a>
  <div class="card" id="listCard" style="display:none;margin-top:10px"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 設定（ここだけ書き換え） ===================== */
const CONFIG = {
  // Apps Script のウェブアプリURL（未設定のときはデモ表示）
  GAS_URL: 'https://script.google.com/macros/s/AKfycbw1lP3AlnybYrB9j3aiHpyzVXO1-vgT_uLthsKXPjsq7dNlrDiuQ6B3RwAqX9aoxvTwRQ/exec',

  // 1人あたりの金額（円）。スプレッドシートに「金額」列があればそちらを優先。0なら金額を表示しない
  PRICE: 20350,

  // 現金払いの日程
  CASH_DATES: ['11/8（日）', '11/14（土）'],

  // 振込先
  BANK: {
    bank: 'PayPay銀行', bankCode: '0033',
    branch: 'うぐいす支店', branchCode: '008',
    type: '普通', number: '4457731',
    holder: 'ヤスダユウキ'
  },

  // PayPay：受け取りリンク（マイコードの共有リンク）と PayPay ID
  PAYPAY: {
    link: 'https://qr.paypay.ne.jp/p2p01_WrNznuHY1n32JQa6',   // PayPay受け取りリンク
    id: 'shallotou'      // 例 team-uniform
  },

  // GAS_URL 未設定時のデモ用名前
  DEMO_NAMES: ['山田 太郎', '佐藤 次郎', '鈴木 三郎']
};
/* ==================================================================== */

const $ = s => document.querySelector(s);
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
let DATA = { names: [], amounts: {}, orders: {}, status: {} };
let method = '', cashDate = '';

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('コピーしました：' + text);
}
function row(label, value, copyVal){
  const c = copyVal ? `<button class="cp" data-copy="${copyVal}">コピー</button>` : '';
  return `<tr><td>${label}</td><td class="v">${value}</td><td style="text-align:right">${c}</td></tr>`;
}
function amountOf(name){ return DATA.amounts[name] || CONFIG.PRICE || 0; }

/* ---------- 表示組み立て ---------- */
function renderStatic(){
  $('#cashDesc').textContent = CONFIG.CASH_DATES.join(' または ') + ' に手渡し';
  $('#cashChips').innerHTML = CONFIG.CASH_DATES.map(d=>`<button class="chip" data-d="${d}">${d}</button>`).join('');
  renderBank(); renderPayPay();
}
function renderBank(){
  const b = CONFIG.BANK, amt = amountOf($('#name').value);
  $('#bankTable').innerHTML =
    row('銀行', `${b.bank}（${b.bankCode}）`, b.bank) +
    row('支店', `${b.branch}（${b.branchCode}）`, b.branchCode) +
    row('口座', `${b.type} ${b.number}`, b.number) +
    row('名義', b.holder, b.holder) +
    (amt ? row('金額', yen(amt), String(amt)) : '');
}
function renderPayPay(){
  const p = CONFIG.PAYPAY, amt = amountOf($('#name').value);
  $('#ppTable').innerHTML =
    (p.id ? row('PayPay ID', p.id, p.id) : '') +
    (amt ? row('金額', yen(amt), String(amt)) : '');
  const btn = $('#ppBtn');
  if (p.link){ btn.href = p.link; btn.style.display='block';
    $('#ppNote').innerHTML = 'ボタンを押すとPayPayアプリが開き、送金画面になります。金額を入力して送ってください。' + (p.id ? '<br>開けない場合は、アプリの「送る」→ID検索で上のPayPay IDを入力してください。' : '');
  } else { btn.style.display='none';
    $('#ppNote').innerHTML = p.id ? 'PayPayアプリの「送る」→「携帯電話番号・PayPay IDを検索」で上のIDを入力して送ってください。' : '<b>※PayPayの送金先は準備中です</b>';
  }
}
function renderOrder(){
  const n = $('#name').value, box = $('#order'), prev = $('#prev');
  if(!n){ box.style.display='none'; prev.style.display='none'; return; }
  const o = DATA.orders[n] || {}, amt = amountOf(n);
  const parts = [];
  if (o.number) parts.push('背番号 ' + o.number);
  if (o.uniform) parts.push('ユニフォーム ' + o.uniform);
  if (o.cap) parts.push('帽子 ' + o.cap);
  box.innerHTML = (parts.length ? `<div>${parts.join('／')}</div>` : '') +
                  (amt ? `<div style="margin-top:4px">お支払い金額</div><div class="amt">${yen(amt)}</div>` : '');
  box.style.display = (parts.length || amt) ? 'block' : 'none';
  const s = DATA.status[n];
  if (s && s.method){ prev.style.display='block';
    prev.textContent = s.paid ? `入金確認済みです（${s.method}）。ありがとうございました！` : `登録済み：${s.method}${s.detail ? '（'+s.detail+'）' : ''}　※選び直すと上書きされます`;
  } else prev.style.display='none';
  renderBank(); renderPayPay();
}
function validate(){
  let ok = $('#name').value && method;
  if (method==='現金' && !cashDate) ok = false;
  if (method==='その他' && !$('#other').value.trim()) ok = false;
  $('#submit').disabled = !ok;
}
function renderList(){
  const names = DATA.names;
  if (!names.length){ $('#listCard').innerHTML='<p class="note">まだデータがありません</p>'; return; }
  const counts = {};
  const rows = names.map(n=>{
    const s = DATA.status[n] || {};
    if (s.method) counts[s.method]=(counts[s.method]||0)+1;
    const tag = s.paid ? '<span class="tag paid">入金済</span>' : (s.method ? '<span class="tag">未確認</span>' : '<span class="tag" style="color:#b5651d">未登録</span>');
    return `<tr><td>${n}</td><td>${s.method||'−'}${s.detail?'<br><span style="font-size:12px;color:#5d6b78">'+s.detail+'</span>':''}</td><td>${tag}</td></tr>`;
  }).join('');
  const sum = ['現金','銀行振込','PayPay','その他'].map(m=>`${m} ${counts[m]||0}`).join('／');
  $('#listCard').innerHTML = `<p class="note" style="margin:0 0 8px">${sum}</p><table><tr><th>名前</th><th>支払い方法</th><th>状況</th></tr>${rows}</table>`;
}

/* ---------- データ通信 ---------- */
async function load(){
  if (!CONFIG.GAS_URL){
    const bn=$('#banner'); bn.style.display='block';
    bn.textContent='デモ表示中です（Apps ScriptのURLが未設定のため、登録内容は保存されません）';
    DATA.names = CONFIG.DEMO_NAMES;
  } else {
    try{
      const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 20000);
      const r = await fetch(CONFIG.GAS_URL + '?action=list', {signal: ctrl.signal});
      clearTimeout(tm);
      const txt = await r.text();
      let j; try{ j = JSON.parse(txt); }catch(_){ throw new Error('JSONではない応答（Apps Scriptの公開設定を確認）'); }
      if (!j.ok) throw new Error(j.error);
      DATA = j;
    }catch(e){
      const bn=$('#banner'); bn.style.display='block';
      bn.textContent='名前一覧の読み込みに失敗しました：' + (e.name==='AbortError' ? 'タイムアウト' : e.message);
    }
  }
  $('#name').innerHTML = '<option value="">お名前を選んでください</option>' +
    DATA.names.map(n=>`<option>${n}</option>`).join('');
}
async function save(){
  const name = $('#name').value;
  const detail = method==='現金' ? cashDate : method==='その他' ? $('#other').value.trim() : '';
  const amt = amountOf(name);
  $('#submit').disabled = true; $('#submit').textContent = '送信中…';
  try{
    if (CONFIG.GAS_URL){
      const q = new URLSearchParams({action:'save', name, method, detail, amount: amt||''});
      const j = await (await fetch(CONFIG.GAS_URL + '?' + q)).json();
      if (!j.ok) throw new Error(j.error);
    }
    $('#form').style.display='none'; $('#done').classList.add('show');
    const msg = {
      '現金': `${cashDate} に現金でお支払いください。`,
      '銀行振込': `下記へお振込みください。<br><b>${CONFIG.BANK.bank} ${CONFIG.BANK.branch}（${CONFIG.BANK.branchCode}）普通 ${CONFIG.BANK.number}</b>`,
      'PayPay': CONFIG.PAYPAY.link ? `<a class="btn btn-pp" href="${CONFIG.PAYPAY.link}" target="_blank" rel="noopener">PayPayアプリで送る</a>` : 'PayPayで送金をお願いします。',
      'その他': '担当者から連絡します。'
    }[method];
    $('#doneMsg').innerHTML = `${name} さん／${method}${amt ? '／' + yen(amt) : ''}<br><br>${msg}`;
  }catch(e){
    toast('送信に失敗しました。もう一度お試しください');
    $('#submit').disabled=false; $('#submit').textContent='この内容で登録する';
  }
}

/* ---------- イベント ---------- */
document.addEventListener('click', e=>{
  const cp = e.target.closest('[data-copy]'); if (cp){ copy(cp.dataset.copy); return; }
  const opt = e.target.closest('.opt');
  if (opt){
    method = opt.dataset.m;
    document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on', o===opt));
    document.querySelectorAll('.detail').forEach(d=>d.classList.toggle('show', d.id==='d-'+method));
    validate(); return;
  }
  const chip = e.target.closest('.chip');
  if (chip){ cashDate = chip.dataset.d; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===chip)); validate(); }
});
$('#name').addEventListener('change', ()=>{ renderOrder(); validate(); });
$('#other').addEventListener('input', validate);
$('#submit').addEventListener('click', save);
$('#toggleList').addEventListener('click', e=>{
  e.preventDefault(); const c=$('#listCard'); const open = c.style.display==='none';
  c.style.display = open ? 'block' : 'none'; if (open) renderList();
});

renderStatic(); load();
</script>
</body>
</html>
